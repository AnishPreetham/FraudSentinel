name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: python -m pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets in env files
        run: |
          if grep -r "ANTHROPIC_API_KEY=sk-" . --include="*.env" --include="*.yml" --exclude-dir=".git" 2>/dev/null; then
            echo "ERROR: Possible API key found in tracked files"
            exit 1
          fi
          echo "No secrets found in tracked files"
      - name: Verify .env not tracked
        run: |
          if git ls-files | grep -E "^\.env$"; then
            echo "ERROR: .env file is tracked by git"
            exit 1
          fi
          echo ".env is not tracked"
