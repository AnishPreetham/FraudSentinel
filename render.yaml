services:
  - type: web
    name: fraudsentinel-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./fraud_investigation.db
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TIGERGRAPH_HOST
        sync: false
      - key: TIGERGRAPH_USERNAME
        sync: false
      - key: TIGERGRAPH_PASSWORD
        sync: false
      - key: TIGERGRAPH_GRAPH
        sync: false
